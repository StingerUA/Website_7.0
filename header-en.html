<script>
(function () {
      function positionAlienMenu(menu, trigger) {
    var isMobile = window.innerWidth <= 767;
    if (isMobile) {
      // На мобильном: прижимаем под хедер, CSS сделает остальное (full-width row)
      var headerEl = document.querySelector('.site-header') || document.querySelector('header');
      var headerBottom = headerEl ? headerEl.getBoundingClientRect().bottom : 60;
      menu.style.top  = headerBottom + 'px';
      menu.style.left = '0';
      menu.style.right = '0';
      menu.style.transform = 'none';
    } else {
      // Десктоп: прямо под кнопкой-триггером
      var rect = trigger.getBoundingClientRect();
      var menuW = 220;
      var gap = 6;
      var left = rect.left;
      if (left + menuW > window.innerWidth - 8) left = window.innerWidth - menuW - 8;
      menu.style.top  = (rect.bottom + gap) + 'px';
      menu.style.left = Math.max(8, left) + 'px';
      menu.style.right = 'auto';
      menu.style.transform = 'none';
    }
  }

  function toggleAlienMenu(e) {
    if (e) e.preventDefault();
    var menu = document.getElementById('alienMenu');
    var trigger = document.querySelector('.alien-ghost');
    if (!menu || !trigger) return;
    if (menu.hasAttribute('hidden')) {
      positionAlienMenu(menu, trigger);
      menu.removeAttribute('hidden');
    } else {
      menu.setAttribute('hidden', '');
    }
  }

  window.addEventListener('resize', function() {
    var menu = document.getElementById('alienMenu');
    var trigger = document.querySelector('.alien-ghost');
    if (menu && trigger && !menu.hasAttribute('hidden')) positionAlienMenu(menu, trigger);
  });

  function closeAlienMenu() {
    const menu = document.getElementById('alienMenu');
    const trigger = document.querySelector('.alien-ghost');
    if (menu) menu.setAttribute('hidden', '');
    if (trigger) trigger.setAttribute('aria-expanded', 'false');
  }

  document.addEventListener('click', function (e) {
    const container = document.querySelector('.alien-dropdown-container');
    if (container && !container.contains(e.target)) closeAlienMenu();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeAlienMenu();
  });

  window.toggleAlienMenu = toggleAlienMenu;
}());
</script>
