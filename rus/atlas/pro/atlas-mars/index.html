<style> :root { --header-bg: #020617; --accent: #00c2ff; } * { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: Arial, sans-serif; background-size: cover; color: #fff; opacity: 0; animation: fadeInBody 0.8s ease-out forwards; } @keyframes fadeInBody { to { opacity: 1; } } /* HEADER */    .header-logo img { width: 40px; height: 40px; border-radius: 999px; padding: 4px; } .header-logo span { font-weight: 600; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; }  .main-nav a { color: #d1d5db; text-decoration: none; position: relative; padding-bottom: 2px; } .main-nav a:hover { color: #ffffff; } .main-nav a.active::after { content: ""; position: absolute; left: 0; bottom: -2px; width: 100%; height: 2px; border-radius: 999px; }  .social-icon-svg { width: 22px; height: 22px; fill: none; stroke: #e5e7eb; stroke-width: 1.6; transition: stroke 0.2s, transform 0.15s; } .header-social a:hover .social-icon-svg { stroke: #ffffff; transform: translateY(-1px); } .top-lang-switch { display: flex; gap: 6px; align-items: center; font-size: 13px; } .top-lang-switch a { padding: 4px 10px; border-radius: 999px; border: 1px solid #4b5563; color: #e5e7eb; text-decoration: none; } .top-lang-switch a.active { color: #020617; font-weight: 600; } /* КОНТЕНТ СТРАНИЦЫ */ h1 { text-align: center; margin-top: 100px; margin-bottom: 15px; font-size: 32px; text-shadow: 0 0 15px #000; } .container { width: 90%; max-width: 1200px; margin: auto; padding-bottom: 50px; backdrop-filter: blur(2px); } p { text-align: center; font-size: 18px; text-shadow: 0 0 8px #000; max-width: 900px; margin: 20px auto; } /* ОБЁРТКА для model-viewer + прелоадера */ .viewer-wrapper{ position: relative; width: 100%; margin-top: 30px; border-radius: 12px; overflow: hidden; /* чтобы оверлей не вылезал за скругления */ box-shadow: 0 0 30px rgba(0, 150, 255, 0.5); } model-viewer { width: 100%; height: 600px; display: block; } @media (max-width: 768px) { h1 { font-size: 26px; margin-top: 90px; } model-viewer { height: 420px; } } 
    html, body {
      overflow-x: hidden !important;
      width: 100% !important;
      position: relative !important;
      margin: 0 !important;
      padding: 0 !important;
    }

      box-sizing: border-box !important;
    }

<body>
<div data-include="/header-ru.html"></div>
<h1>Марс</h1>
<div class="container">
<p>
      Марс с его тонкой атмосферой и красной поверхностью является важной целью для будущих пилотируемых миссий.
    </p>
<model-viewer ar="" ar-modes="webxr scene-viewer quick-look" camera-controls="" data-model-name="mars" data-track="model_view" src="/assets/models/zaglushka.glb">
</model-viewer>
</div>
<div data-include="/footer-ru.html"></div>
<!-- Model Viewer Fix Script - Direct initialization -->
<script>
    (function() {
      console.log('[Model-Viewer Init] Checking model-viewer status...');
      
      // Wait for model-viewer to be loaded
      const checkModelViewer = () => {
        const viewer = document.querySelector('model-viewer');
        if (!viewer) {
          console.log('[Model-Viewer Init] No model-viewer element found');
          return;
        }
        
        // Check if custom element is registered
        if (window.customElements && window.customElements.get('model-viewer')) {
          console.log('[Model-Viewer Init] model-viewer element is registered ✓');
          return;
        }
        
        // If not registered yet, check again in 500ms
        setTimeout(checkModelViewer, 500);
      };
      
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', checkModelViewer);
      } else {
        setTimeout(checkModelViewer, 100);
      }
    })();
  </script>
</body>
</html>
