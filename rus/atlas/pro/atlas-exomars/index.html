<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ЭкзоМарс – Альба Спейс</title>
<!-- Универсальный favicon-блок -->
<link href="/assets/icons/AlbaLogo.png" rel="icon" sizes="32x32" type="image/png"/>
<link href="/assets/icons/AlbaLogo.png" rel="icon" sizes="32x32" type="image/png"/>
<link href="/assets/icons/AlbaLogo.png" rel="apple-touch-icon" sizes="180x180"/>
<link href="/manifest.json" rel="manifest"/>
<meta content="#020617" name="theme-color"/>
<meta content="#020617" name="msapplication-TileColor"/>
<meta content="/favicon.png" name="msapplication-TileImage"/>
<script crossorigin="anonymous" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.0.0/model-viewer.min.js" type="module"></script>
<!-- styles via site.css -->
<link href="/assets/css/site.css" rel="stylesheet">
<script defer="" src="/assets/js/include.js"></script>
<script defer="" src="/assets/js/menu-toggle.js"></script>
<script defer="" src="/assets/js/model-viewer-debug.js"></script>
</link></head>
<body>
<div data-include="/header-ru.html"></div>
<h1 style="margin-top: 20px;">ЭкзоМарс</h1>
<div class="container">
<p>ExoMars — совместная миссия, направленная на поиск следов прошлой или настоящей жизни на Марсе.</p>
<model-viewer ar="" ar-modes="webxr scene-viewer quick-look" camera-controls="" data-model-name="exomars" data-track="model_view" loading="eager" reveal="auto" src="/assets/models/zaglushka.glb"></model-viewer>
</div>
<div data-include="/footer-ru.html"></div>
<!-- Model Viewer Fix Script - Direct initialization -->
<script>
    (function() {
      console.log('[Model-Viewer Init] Checking model-viewer status...');
      
      // Wait for model-viewer to be loaded
      const checkModelViewer = () => {
        const viewer = document.querySelector('model-viewer');
        if (!viewer) {
          console.log('[Model-Viewer Init] No model-viewer element found');
          return;
        }
        
        // Check if custom element is registered
        if (window.customElements && window.customElements.get('model-viewer')) {
          console.log('[Model-Viewer Init] model-viewer element is registered ✓');
          return;
        }
        
        // If not registered yet, check again in 500ms
        setTimeout(checkModelViewer, 500);
      };
      
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', checkModelViewer);
      } else {
        setTimeout(checkModelViewer, 100);
      }
    })();
  </script>
</body>
</html>
