<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hesap – Alba Space</title>
  
  <link rel="icon" type="image/png" href="/assets/icons/AlbaLogo.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icons/AlbaLogo.png" sizes="180x180">
  
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/fix-layout.css">
  
  <script src="/assets/js/include.js" defer></script>
  <script src="/assets/js/menu-toggle.js" defer></script>
  <script src="/assets/js/mobile-header-cart.js" defer></script>

  <style>
    html, body {
      margin: 0; padding: 0;
      min-height: 100vh;
      background: #020617; /* Темный фон как на главной */
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
    }

    /* ВАЖНО: Добавлен margin-top, чтобы контент не заезжал ПОД фиксированный хедер.
       На главной у вас 120px, здесь ставим столько же для единообразия.
    */
    .am-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 100px; /* Отступ под хедер */
      padding: 0 0 60px;
    }

    /* ── Top bar (кнопка Geri + заголовок) ── */
    .am-topbar {
      width: 100%;
      max-width: 1100px; /* Ограничим ширину для красоты на десктопе */
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      box-sizing: border-box;
    }
    .am-back {
      display: flex; align-items: center; gap: 6px;
      color: rgba(255,255,255,0.7); text-decoration: none;
      font-size: 15px; font-weight: 500; transition: color 0.2s;
    }
    .am-back:hover { color: #fff; }
    .am-back svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
    .am-title  { font-size: 16px; font-weight: 600; color: #fff; }
    .am-placeholder { width: 48px; }

    /* ── Стили секций ── */
    .am-section-logged-in,
    .am-section-logged-out { width: 100%; display: flex; flex-direction: column; align-items: center; }
    .am-section-logged-in[hidden],
    .am-section-logged-out[hidden]  { display: none !important; }

    /* ── Карточка пользователя ── */
    .am-user-card {
      display: flex; flex-direction: column; align-items: center;
      gap: 12px; padding: 32px 20px 24px;
      width: 100%; max-width: 400px; box-sizing: border-box;
    }
    .am-avatar {
      width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
      border: 2px solid rgba(0,194,255,0.5);
      box-shadow: 0 0 24px rgba(0,194,255,0.2);
    }
    .am-name  { font-size: 20px; font-weight: 600; color: #fff; text-align: center; }
    .am-email { font-size: 13px; color: rgba(255,255,255,0.5); text-align: center; margin-top: -6px; }

    /* ── Меню ── */
    .am-menu {
      width: 100%; max-width: 400px; padding: 0 16px;
      box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;
    }
    .am-item {
      display: flex; align-items: center; gap: 14px; padding: 16px 18px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; color: #fff; text-decoration: none;
      font-size: 16px; font-weight: 500;
      transition: background 0.18s, border-color 0.18s, transform 0.15s;
    }
    .am-item:hover, .am-item:active {
      background: rgba(0,194,255,0.1); border-color: rgba(0,194,255,0.3); transform: translateX(2px);
    }
    .am-item svg { width: 22px; height: 22px; flex-shrink: 0; stroke: #00c2ff; fill: none; stroke-width: 1.8; }
    .am-item-label { flex: 1; }
    .am-item-arrow { width: 16px; height: 16px; stroke: rgba(255,255,255,0.3); fill: none; stroke-width: 2; flex-shrink: 0; }
    .am-item.logout {
      background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.2); color: #fca5a5;
      cursor: pointer; width: 100%; font-family: inherit; border-width: 1px; border-style: solid;
    }
    .am-item.logout:hover { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.35); }
    .am-item.logout svg { stroke: #f87171; }

    /* ── Кнопки входа ── */
    .am-btn {
      display: block; width: 100%; max-width: 400px; padding: 14px 20px;
      border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; border: none;
      transition: opacity 0.2s, transform 0.15s; text-align: center; text-decoration: none; box-sizing: border-box;
      font-family: inherit;
    }
    .am-btn-primary   { background: #00c2ff; color: #020617; }
    .am-btn-secondary { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.15); }
    .am-btn-google    { background: #fff; color: #333; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .am-btn-google img { width: 20px; height: 20px; }
    .am-btn-group {
      display: flex; flex-direction: column; gap: 10px;
      width: 100%; max-width: 400px; padding: 20px 16px 0; box-sizing: border-box;
    }

    /* Адаптив для хедера на мобилках */
    @media (max-width: 900px) {
      .am-page { margin-top: 80px; }
    }
  </style>
</head>
<body>

  <div data-include="/header-tr.html"></div>

  <div class="am-page">

    <div class="am-topbar">
      <a href="javascript:history.back()" class="am-back">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Geri
      </a>
      <span class="am-title">Hesap</span>
      <div class="am-placeholder"></div>
    </div>

    <div class="am-section-logged-in" id="amSectionLoggedIn" hidden>
      <div class="am-user-card">
        <img id="amPageAvatar" class="am-avatar" src="/assets/icons/alien.png" alt="">
        <div class="am-name" id="amPageName">Kullanıcı</div>
        <div class="am-email" id="amPageEmail"></div>
      </div>

      <div class="am-menu">
        <a href="/account.html" class="am-item">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <span class="am-item-label">Hesap</span>
          <svg class="am-item-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
        <a href="/favorites.html" class="am-item">
          <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="am-item-label">Favoriler</span>
          <svg class="am-item-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
        <a href="/orders.html" class="am-item">
          <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          <span class="am-item-label">Satın Aldıklarım</span>
          <svg class="am-item-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
        <button class="am-item logout" id="amLogoutBtn">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span class="am-item-label">Çıkış Yap</span>
        </button>
      </div>
    </div>

    <div class="am-section-logged-out" id="amSectionLoggedOut">
      <div class="am-logged-out-inner" style="text-align: center; padding-top: 32px;">
        <div class="am-avatar-placeholder" style="width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.08); margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 24 24" style="width: 40px; height: 40px; stroke: rgba(255,255,255,0.3); fill: none;"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </div>
        <h2 style="font-size: 20px; margin-bottom: 8px;">Giriş Yapın</h2>
        <p style="font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 28px;">Hesabınıza erişmek için giriş yapın</p>
      </div>

      <div class="am-btn-group">
        <button class="am-btn am-btn-google" onclick="if(typeof login === 'function') login({ source: 'account-menu' })">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
          Google ile Giriş Yap
        </button>
        <a href="javascript:void(0);" class="am-btn am-btn-primary open-login">Giriş Yap</a>
        <a href="javascript:void(0);" class="am-btn am-btn-secondary open-signup">Kayıt Ol</a>
      </div>
    </div>

  </div>

  <div data-include="/footer-tr.html"></div>

<script>
(function () {
  'use strict';

  var ME_URL = 'https://albaspace-api.nncdecdgc.workers.dev/me';

  function applyUser(user) {
    var isLoggedIn = !!(user && (user.name || user.email || user.avatar));

    var secIn  = document.getElementById('amSectionLoggedIn');
    var secOut = document.getElementById('amSectionLoggedOut');
    if (secIn)  secIn.hidden  = !isLoggedIn;
    if (secOut) secOut.hidden =  isLoggedIn;

    if (isLoggedIn) {
      var avatar = document.getElementById('amPageAvatar');
      var name   = document.getElementById('amPageName');
      var email  = document.getElementById('amPageEmail');
      if (avatar) {
        avatar.src = user.avatar || '/assets/icons/alien.png';
        if (user.avatar) avatar.crossOrigin = 'anonymous';
      }
      if (name)  name.textContent  = user.name  || user.email || 'Kullanıcı';
      if (email) email.textContent = user.email || '';
    }
  }

  function fetchAndApply() {
    fetch(ME_URL, { credentials: 'include', mode: 'cors' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(applyUser)
      .catch(function () { applyUser(null); });
  }

  function bindLogout() {
    var btn = document.getElementById('amLogoutBtn');
    if (!btn) return;
    btn.addEventListener('click', function () {
      if (typeof window.logout === 'function') window.logout();
      setTimeout(function () { window.location.href = '/'; }, 600);
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    bindLogout();
    // Даем небольшую задержку, чтобы основные скрипты хедера успели инициализироваться
    setTimeout(fetchAndApply, 600);
  });
}());
</script>
</body>
</html>
