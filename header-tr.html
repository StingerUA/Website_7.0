<script>
(function () {
  /* ── ALIEN MENU ── */
  function positionAlienMenu(menu, trigger) {
    var isMobile = window.innerWidth <= 767;
    if (isMobile) {
      var hdr = document.querySelector('.site-header');
      var top = hdr ? hdr.getBoundingClientRect().bottom : 56;
      menu.style.top       = top + 'px';
      menu.style.left      = '0';
      menu.style.right     = '0';
      menu.style.width     = '100vw';
      menu.style.transform = 'none';
    } else {
      var r    = trigger.getBoundingClientRect();
      var mw   = 200;
      var left = Math.min(r.left, window.innerWidth - mw - 8);
      menu.style.top       = (r.bottom + 6) + 'px';
      menu.style.left      = Math.max(8, left) + 'px';
      menu.style.right     = 'auto';
      menu.style.width     = 'auto';
      menu.style.transform = 'none';
    }
  }

  function toggleAlienMenu(e) {
    if (e) e.preventDefault();
    var menu    = document.getElementById('alienMenu');
    var trigger = document.querySelector('.alien-ghost');
    if (!menu || !trigger) return;
    if (menu.hasAttribute('hidden')) {
      positionAlienMenu(menu, trigger);
      menu.removeAttribute('hidden');
      trigger.setAttribute('aria-expanded', 'true');
    } else {
      menu.setAttribute('hidden', '');
      trigger.setAttribute('aria-expanded', 'false');
    }
  }

  window.addEventListener('resize', function () {
    var menu    = document.getElementById('alienMenu');
    var trigger = document.querySelector('.alien-ghost');
    if (menu && trigger && !menu.hasAttribute('hidden')) positionAlienMenu(menu, trigger);
  });

  document.addEventListener('click', function (e) {
    var menu = document.getElementById('alienMenu');
    var cont = document.querySelector('.alien-dropdown-container');
    if (menu && cont && !cont.contains(e.target)) {
      menu.setAttribute('hidden', '');
      var t = document.querySelector('.alien-ghost');
      if (t) t.setAttribute('aria-expanded', 'false');
    }
  });

  window.toggleAlienMenu = toggleAlienMenu;

  /* ── LANG DROPDOWN ── */
  function toggleLangDropdown(e) {
    if (e) e.preventDefault();
    var menu = document.getElementById('langMenu');
    var btn  = document.getElementById('langTrigger');
    if (!menu) return;
    if (menu.hasAttribute('hidden')) {
      menu.removeAttribute('hidden');
      if (btn) btn.setAttribute('aria-expanded', 'true');
    } else {
      menu.setAttribute('hidden', '');
      if (btn) btn.setAttribute('aria-expanded', 'false');
    }
  }

  document.addEventListener('click', function (e) {
    var menu = document.getElementById('langMenu');
    var wrap = document.getElementById('langDropdown');
    if (menu && wrap && !wrap.contains(e.target)) {
      menu.setAttribute('hidden', '');
      var btn = document.getElementById('langTrigger');
      if (btn) btn.setAttribute('aria-expanded', 'false');
    }
  });

  window.toggleLangDropdown = toggleLangDropdown;
})();
</script>
